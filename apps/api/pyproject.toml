[project]
name = "torii-api"
version = "0.1.0"
description = "Torii media review API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "guessit>=3.8,<4",
  "rapidfuzz>=3.9,<4",
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test-*.py"]
