paths:
  state: /data
  watch:
    movies: /media/downloads/movies
    shows: /media/downloads/shows
  library:
    movies: /media/library/movies
    shows: /media/library/shows

server:
  port: 8000
  host: 0.0.0.0
  log_level: INFO

session_days: 30

queues:
  metadata_poll_seconds: 1
  promotion_poll_seconds: 1
  execution_poll_seconds: 1
  revert_poll_seconds: 1

scan:
  min_size_mb: 0
  extensions:
    - mkv
    - mp4
    - avi
    - mov
    - m4v
    - webm
    - ts
    - m2ts
  poll_interval: 5
  stable_seconds: 0

layout:
  movie: "{title} ({year})/{title}"
  shows: "{title} ({year})/Season {season}/{title} - Season {season} Episode {episode}"

apply:
  action: move

  # runs after any successful apply
  cleanup_empty_dirs: true

  # unattended decisions
  automation:
    auto_apply: false
    auto_apply_confidence: 0.85
