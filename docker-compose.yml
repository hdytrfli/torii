services:
  torii:
    build: .
    image: torii:latest
    container_name: torii
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DEFAULT_USERNAME: test
      DEFAULT_PASSWORD: example
    ports:
      - "8090:8000"
    healthcheck:
      test: ["CMD", "python", "app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - ./temp:/media
      - .:/data
