services:
  torii:
    build: .
    image: torii:latest
    container_name: torii
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:8090:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - ./temp/downloads/movies:/downloads/movies
      - ./temp/downloads/shows:/downloads/shows
      - ./temp/library/movies:/library/movies
      - ./temp/library/shows:/library/shows
      - .:/data
