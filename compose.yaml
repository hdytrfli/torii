services:
  torii:
    build: .
    image: torii:latest
    container_name: torii
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DEFAULT_USERNAME: test
      DEFAULT_PASSWORD: example
    ports:
      - "127.0.0.1:8090:8000"
    healthcheck:
      test: ["CMD", "python", "app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - ./temp/downloads/movies:/downloads/movies
      - ./temp/downloads/shows:/downloads/shows
      - ./temp/library/movies:/library/movies
      - ./temp/library/shows:/library/shows
      - .:/data
