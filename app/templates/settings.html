{% extends "base.html" %}

{% block content %}
<h1>Settings</h1>
<p class="muted">These values live in SQLite and apply on the next scan.</p>

<form method="post" action="/settings" class="settings-form">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <section class="panel">
    <h2>Scanning</h2>
    <div class="grid">
      <label>Minimum file size (MB)
        <input type="number" step="0.1" min="0" name="min_size_mb" value="{{ settings.min_size_mb }}">
        <span class="hint">Files smaller than this are ignored. Use 0 while testing.</span>
      </label>
      <label>File extensions
        <input type="text" name="extensions" value="{{ settings.extensions|join(', ') }}">
        <span class="hint">Comma separated. Example: mkv, mp4, avi, mov, m4v, webm.</span>
      </label>
      <label>Poll interval (seconds)
        <input type="number" min="1" name="poll_interval" value="{{ settings.poll_interval }}">
      </label>
      <label>Stable for (seconds)
        <input type="number" min="0" name="stable_seconds" value="{{ settings.stable_seconds }}">
        <span class="hint">How long the size and mtime must stay unchanged.</span>
      </label>
    </div>
  </section>

  <section class="panel">
    <h2>Layouts</h2>
    <div class="stack">
      <label>Movie layout
        <input type="text" name="movie_template" value="{{ settings.movie_template }}">
        <span class="hint">Relative to <code>LIBRARY_DIR/movies</code>. Preview: <code>{{ movie_preview }}</code></span>
      </label>
      <label>Show layout
        <input type="text" name="tv_template" value="{{ settings.tv_template }}">
        <span class="hint">Relative to <code>LIBRARY_DIR/shows</code>. Preview: <code>{{ tv_preview }}</code></span>
      </label>
    </div>
    <p class="hint">
      Placeholders: <code>{title}</code>, <code>{year}</code>, <code>{folder}</code>,
      <code>{season}</code>, <code>{episode}</code>, <code>{episode_tag}</code>,
      <code>{quality}</code>, <code>{source}</code>, <code>{codec}</code>,
      <code>{group}</code>, <code>{ext}</code>.
    </p>
  </section>

  <section class="panel">
    <h2>Applying files</h2>
    <div class="grid">
      <label>Default action
        <select name="action">
          <option value="move" {% if settings.action == "move" %}selected{% endif %}>Move</option>
          <option value="copy" {% if settings.action == "copy" %}selected{% endif %}>Copy</option>
          <option value="hardlink" {% if settings.action == "hardlink" %}selected{% endif %}>Hardlink</option>
        </select>
      </label>
      <label>Auto apply confidence
        <input type="number" step="0.01" min="0" max="1" name="auto_apply_confidence" value="{{ settings.auto_apply_confidence }}">
        <span class="hint">Only used when auto apply is on.</span>
      </label>
    </div>

    <div class="checks">
      <label class="check"><input type="checkbox" name="auto_apply" {% if settings.auto_apply %}checked{% endif %}> Auto apply high-confidence jobs</label>
      <label class="check"><input type="checkbox" name="delete_source" {% if settings.delete_source %}checked{% endif %}> Delete source after copy</label>
      <label class="check"><input type="checkbox" name="cleanup_empty_dirs" {% if settings.cleanup_empty_dirs %}checked{% endif %}> Remove empty source folders</label>
      <label class="check"><input type="checkbox" name="dry_run" {% if settings.dry_run %}checked{% endif %}> Dry run, do not touch files</label>
    </div>
  </section>

  <button class="button" type="submit">Save settings</button>
</form>
{% endblock %}
