{% extends "base.html" %}

{% block content %}
<div class="auth-card">
  <h1>Set up media-renamer</h1>
  <p class="muted">Create the first administrator account. This page disappears after the account exists.</p>
  <form method="post" action="/setup">
    <label>Username
      <input type="text" name="username" autocomplete="username" minlength="3" maxlength="32" autofocus required>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
    </label>
    <label>Confirm password
      <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
    </label>
    <button class="button" type="submit">Create administrator</button>
  </form>
</div>
{% endblock %}
